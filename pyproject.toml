[project]
name = "brewfather-tools"
version = "0.1.0"
description = "A set of scripts for interacting with Brewfather."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kaleido>=0.2.1",
    "pandas>=2.2.2",
    "plotly>=5.20.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "typer>=0.9.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "ty>=0.0.86",
]
